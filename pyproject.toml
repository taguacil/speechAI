[project]
name = "speechai"
version = "1.0.0"
description = "Real-time speech sentiment analysis for sales assistants"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "azure-cognitiveservices-speech>=1.47.0",
    "azure-storage-blob>=12.0.0",
    "gradio>=4.0.0",
    "litellm>=1.81.6",
    "numpy>=2.4.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.31.0",
    "setuptools>=80.10.2",
    "sounddevice>=0.5.5",
    "textual>=3.0.0",
    "webrtcvad>=2.0.10",
]

[project.scripts]
speechai = "speechai.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechai"]
