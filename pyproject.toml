[project]
name = "speechai"
version = "0.1.0"
description = "Real-time speech sentiment analysis for sales assistants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-cognitiveservices-speech>=1.47.0",
    "litellm>=1.81.6",
    "numpy>=2.4.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "setuptools>=80.10.2",
    "sounddevice>=0.5.5",
    "webrtcvad>=2.0.10",
]

[project.scripts]
speechai = "speechai.main:main"
speechai-gemini = "speechai.main_gemini:main"
speechai-file = "speechai.main_file:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechai"]
